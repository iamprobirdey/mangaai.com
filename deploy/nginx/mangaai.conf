# Nginx site for MangaAI on a DigitalOcean droplet.
# Install:  sudo cp deploy/nginx/mangaai.conf /etc/nginx/sites-available/mangaai
#           sudo ln -s /etc/nginx/sites-available/mangaai /etc/nginx/sites-enabled/mangaai
#           sudo nginx -t && sudo systemctl reload nginx
# Then get a certificate:  sudo certbot --nginx -d mangaai.com -d www.mangaai.com
# (certbot adds the `listen 443 ssl` lines and the HTTP -> HTTPS redirect to this file.)

upstream mangaai_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# www -> apex
server {
  listen 80;
  listen [::]:80;
  server_name www.mangaai.com;
  return 301 https://mangaai.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name mangaai.com;

  # Studio PDF uploads go straight from the browser to Supabase Storage; the app itself only
  # receives small form posts (server actions are capped at 2 MB in next.config.ts).
  client_max_body_size 3m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # Country pricing reads the visitor's country from a geo header. Never trust one sent by the
  # visitor. If the site is behind Cloudflare (proxied, orange cloud), pass Cloudflare's header
  # through by switching the cf-ipcountry line below to:  proxy_set_header cf-ipcountry $http_cf_ipcountry;
  # and restrict the droplet's firewall to Cloudflare IPs so nobody can bypass it.
  set $geo_country "";

  location / {
    proxy_pass http://mangaai_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header x-vercel-ip-country "";
    proxy_set_header x-country "";
    proxy_set_header cf-ipcountry $geo_country;
    proxy_read_timeout 300s;   # cron jobs and PDF processing can take a while
  }

  # Build assets have content hashes in their names; Next.js already sends
  # "Cache-Control: public, max-age=31536000, immutable" for them.
  location /_next/static/ {
    proxy_pass http://mangaai_app;
    proxy_set_header Host $host;
    access_log off;
  }

  # The scheduled-job endpoints are only called from the droplet itself (deploy/cron.sh hits
  # 127.0.0.1:3000 directly), so close them to the internet entirely.
  location /api/cron/ {
    return 404;
  }

  location = /api/health {
    proxy_pass http://mangaai_app;
    access_log off;
  }
}
