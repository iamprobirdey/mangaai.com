<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1f4a">
<title>Offline · MangaAI</title>
<style>
  :root { --ink:#1c1f4a; --paper:#fff; --tone:#eef2fb; --sun:#ffc83d; --soft:#4a4e7a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink);
    background: var(--tone) radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1.2px, transparent 1.4px) 0 0/9px 9px;
    display:flex; flex-direction:column; align-items:center; padding:40px 16px; line-height:1.55; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:20px; }
  .mark { width:36px; height:36px; display:grid; place-items:center; border:3px solid var(--ink); border-radius:8px; background:var(--sun); }
  main { margin-top:40px; width:100%; max-width:420px; background:var(--paper); border:3px solid var(--ink); border-radius:10px;
    box-shadow:5px 5px 0 var(--ink); padding:24px; text-align:center; }
  h1 { font-size:24px; margin:8px 0 0; }
  .hint { color:var(--soft); font-size:14px; }
  ul { list-style:none; padding:0; margin:24px 0 0; text-align:left; display:grid; gap:8px; }
  a.btn { display:block; padding:10px 16px; border:3px solid var(--ink); border-radius:999px; color:var(--ink); font-weight:700; text-decoration:none; background:var(--paper); }
  a.btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  button { margin-top:20px; padding:10px 18px; border:3px solid var(--ink); border-radius:999px; background:var(--sun); font-weight:700; color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
</style>
</head>
<body>
  <div class="logo"><span class="mark" aria-hidden="true">漫</span>MangaAI</div>
  <main>
    <div style="font-size:44px" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>Chapters you opened in the last 7 days can still be read.</p>
    <ul id="saved"></ul>
    <p id="empty" class="hint" hidden>No saved chapters yet. Open a chapter while online to keep it for later.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
<script>
(async function () {
  var list = document.getElementById("saved");
  var found = 0;
  try {
    var names = (await caches.keys()).filter(function (k) { return k.indexOf("mg-chapters") === 0; });
    for (var n = 0; n < names.length; n++) {
      var cache = await caches.open(names[n]);
      var reqs = await cache.keys();
      for (var i = 0; i < reqs.length; i++) {
        var res = await cache.match(reqs[i]);
        var html = res ? await res.text() : "";
        var m = /<title>([^<]*)<\/title>/.exec(html);
        var title = (m ? m[1] : "A saved chapter").replace(" · MangaAI", "").replace(/&amp;/g, "&").replace(/&#x27;|&#39;/g, "'");
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "btn";
        a.href = new URL(reqs[i].url).pathname;
        a.textContent = title;
        li.appendChild(a);
        list.appendChild(li);
        found++;
      }
    }
  } catch (e) {}
  if (!found) document.getElementById("empty").hidden = false;
})();
</script>
</body>
</html>
